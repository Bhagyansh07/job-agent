# Companies whose career pages are watched every 30 min by scripts/watcher.py.
# Supported ATS (public JSON APIs): greenhouse, lever, ashby
# token = the company slug in the ATS URL:
#   greenhouse: boards.greenhouse.io/<token>   lever: jobs.lever.co/<token>   ashby: jobs.ashbyhq.com/<token>
#
# THIS IS A FRESHER LIST (0-1 year experience). Every entry was probed live with
#   python scripts/probe_ats.py --check
# and every entry currently has at least one non-senior engineering/analyst role in India.
