salary_lpa:
  remote_min: 6                 # remote/WFH floor 6 LPA
  onsite_north_min: 8
  other_cities_min: 10          # south/west: only if >= 10 LPA
  service_company_min: 8        # TCS/Infosys type service companies: 8 LPA floor
  service_company_absolute_min: 8
  undisclosed_policy: "apply if product/startup and match>=80; for service-based or other_cities ask on Telegram only if match>=85, else skip"
  internship: "must have a stipend (no unpaid); prefer PPO / conversion to full-time"

include_types: [full-time, internship, off-campus-drive, contract-to-hire]
exclude_types: [walk-in]

match:
  auto_apply_min: 80
  ask_user_min: 60              # 60-79 -> Telegram approval. below 60 -> skip.
  weights: {role_fit: 30, tech_stack: 30, experience_fit: 15, location_salary: 15, freshness_quality: 10}

limits:
  global_daily: 100
  default_per_portal: 15
  per_chat: {chat1: 30, chat2: 25, chat3: 45}
  per_portal:
    naukri: 10
    linkedin: 10
    indeed: 10
    instahyre: 10
    foundit: 10
    hirist: 10
    wellfound: 10
    cutshort: 10
    apna: 8
    glassdoor: 5
    internshala: 10
    unstop: 10
    yc_waas: 10
    remote_boards: 12
    career_pages: 30

session:
  portals_per_cycle: 1
  max_applications_per_cycle: 8
  min_applications_per_portal: 8

active_hours_ist:               # portals with strong bot-detection: only these hours
  strict_portals: [naukri, linkedin, indeed, instahyre, foundit, glassdoor, apna]
  from: "08:00"
  to: "23:30"
  # all other portals / career pages / ATS: 24x7

pacing_seconds:
  between_applications: [25, 90]
  between_clicks: [2, 6]

outreach:
  mode: auto                    # auto | draft
  connection_requests_per_day: 12      # safe range 10-15
  followup_after_days: 6               # once only, 5-7 days
  tone: "professional English; adapt a bit to the person (recruiter vs engineer vs alumni vs founder)"
  targets: [recruiters/HR, SDE/EM at target companies, JECRC alumni, startup founders/CTOs]
  send_dm_only_if: "connection accepted"
