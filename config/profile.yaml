posting_age:                    # days since posted
  normal_max: 3                 # normal thresholds
  extended_max: 7               # need match >= 80
  stretch_max: 14               # need match >= 85 AND a sign it is still active (few applicants / actively hiring / recently reposted)
  hard_skip_over: 14

locations:
  tier1: [remote, work from home, wfh, delhi, new delhi, ncr, gurgaon, gurugram, noida, greater noida, ghaziabad, faridabad]
  tier2: [jaipur, indore, bhopal, jhansi, gwalior, chandigarh, mohali, lucknow, dehradun, kanpur, agra, udaipur, kota, ujjain, jabalpur, raipur]
